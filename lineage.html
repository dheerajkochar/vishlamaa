<style>
:root{
  --bg:#f9f6f1;
  --primary:#7a1f1f;
  --accent:#c59d5f;
  --text:#2b2b2b;
}
body{
  margin:0;
  font-family:'Hind',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.9;
}
header{
  position:sticky;
  top:0;
  background:#fff;
  padding:12px 16px;
  border-bottom:1px solid #eee;
  z-index:10;
}
header h1{
  font-family:'Noto Serif Devanagari',serif;
  font-size:18px;
  color:var(--primary);
}
section{
  max-width:1050px;
  margin:auto;
  padding:60px 20px;
}
h2{
  font-family:'Noto Serif Devanagari',serif;
  color:var(--primary);
  font-size:26px;
}
.divider{
  width:80px;
  height:3px;
  background:var(--accent);
  margin:20px 0 30px;
}
p{margin-bottom:22px;text-align:justify;}

.hero h2{
  color:#fff;
  font-size:36px;
}
.hero p{color:#f5f0e8;}
.timeline{
  border-left:3px solid var(--accent);
  padding-left:26px;
}
.event{
  position:relative;
  margin-bottom:36px;
}
.event::before{
  content:"";
  width:14px;
  height:14px;
  background:var(--primary);
  border-radius:50%;
  position:absolute;
  left:-36px;
  top:6px;
}
.tree{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.node{
  background:#fff;
  border:2px solid var(--accent);
  padding:10px 16px;
  margin:10px;
  text-align:center;
}
.children{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}
.note{
  background:#fff7e6;
  border-left:4px solid var(--accent);
  padding:16px;
}
footer{
  background:#fff;
  text-align:center;
  padding:30px 20px;
  border-top:1px solid #eee;
}
header{
  position:sticky;
  top:0;
  background:#fff;
  border-bottom:1px solid #eee;
  padding:12px 16px;
  z-index:100;
}
header .title{
  font-family:'Noto Serif Devanagari',serif;
  font-size:18px;
  color:var(--primary);
}
nav{
  margin-top:8px;
  display:flex;
  gap:14px;
  font-size:14px;
  flex-wrap:wrap;
}
nav a{
  text-decoration:none;
  color:var(--text);
}
nav a:hover{
  color:var(--primary);
}





body{
    margin:0;

}

#toolbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    z-index:999;
}

button{
    padding:10px 18px;
    cursor:pointer;
    border:none;
    background:#7a0019;
    color:white;
    border-radius:5px;
}

canvas{
    display:block;
    margin:80px auto 40px;
    border:1px solid #ddd;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
