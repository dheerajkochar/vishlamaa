
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>वंशावली | माँ विशलामाता</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;700&family=Hind:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--maroon:#7a1f1f;--gold:#c59d5f;--bg:#f8f5ef}
*{box-sizing:border-box}
body{margin:0;font-family:Hind,sans-serif;background:var(--bg)}
header{position:sticky;top:0;background:#fff;padding:15px;border-bottom:1px solid #ddd;z-index:99}
header h1{margin:0;font:700 24px "Noto Serif Devanagari",serif;color:var(--maroon)}
nav{margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
nav a{text-decoration:none;color:#333}
.toolbar{position:sticky;top:74px;background:#fff;padding:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;border-bottom:1px solid #ddd}
button,a.btn{background:var(--maroon);color:#fff;border:none;padding:10px 14px;border-radius:6px;text-decoration:none;cursor:pointer}
#viewer{padding:20px;display:flex;justify-content:center;overflow:auto}
canvas{background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2);max-width:100%;height:auto}
footer{padding:30px;text-align:center;background:#fff;border-top:1px solid #ddd;margin-top:20px}
@media(max-width:768px){header h1{font-size:20px}.toolbar{top:94px}}
</style>
</head>
<body>
<header>
<h1>कोचर गोत्र | माँ विशलामाता - वंशावली</h1>
<nav>
<a href="index.html">मुखपृष्ठ</a>
<a href="chalisa.html">चालीसा</a>
<a href="pathmala.html">पाठमाला</a>
<a href="stortra.html">स्तोत्रम्</a>
<a href="bhajan.html">भजन</a>
</nav>
</header>

<div class="toolbar">
<button onclick="prevPage()">◀ Prev</button>
<span>Page <span id="p">1</span>/<span id="t">0</span></span>
<button onclick="nextPage()">Next ▶</button>
<button onclick="zoomOut()">-</button>
<button onclick="zoomIn()">+</button>
<button onclick="fit()">Fit Width</button>
<button onclick="full()">Fullscreen</button>
<a class="btn" href="lineage.pdf" download>Download PDF</a>
</div>

<div id="viewer"><canvas id="pdf"></canvas></div>

<footer>
<h3>माँ विशलामाता सबका कल्याण करें 🙏</h3>
<p>यह वेबसाइट कोचर गोत्र की संस्कृति एवं वंशावली को संरक्षित करने का प्रयास है।</p>
</footer>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const url="lineage.pdf";
let pdfDoc,page=1,scale=1.5;
const canvas=document.getElementById("pdf"),ctx=canvas.getContext("2d");

pdfjsLib.getDocument(url).promise.then(pdf=>{
 pdfDoc=pdf;
 document.getElementById("t").textContent=pdf.numPages;
 render();
});

function render(){
 pdfDoc.getPage(page).then(pg=>{
  const vp=pg.getViewport({scale});
  canvas.width=vp.width;
  canvas.height=vp.height;
  pg.render({canvasContext:ctx,viewport:vp});
  document.getElementById("p").textContent=page;
 });
}
function nextPage(){if(page<pdfDoc.numPages){page++;render();}}
function prevPage(){if(page>1){page--;render();}}
function zoomIn(){scale+=0.2;render();}
function zoomOut(){scale=Math.max(.5,scale-.2);render();}
function fit(){
 pdfDoc.getPage(page).then(pg=>{
  const base=pg.getViewport({scale:1});
  scale=(document.getElementById("viewer").clientWidth-30)/base.width;
  render();
 });
}
function full(){document.documentElement.requestFullscreen();}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")nextPage();
 if(e.key==="ArrowLeft")prevPage();
 if(e.key==="+")zoomIn();
 if(e.key==="-")zoomOut();
});
</script>
</body>
</html>
